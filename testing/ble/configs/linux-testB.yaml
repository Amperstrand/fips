# Test B: macOS outbound → Linux inbound (Mac central, Linux peripheral)
#
# Purpose: Prove Mac can initiate outbound L2CAP to Linux.
#          Mac's GATT PSM discovery fails (Linux has no GATT PSM service)
#          and falls back to configured PSM 0x0085.
#
# Mac: central-only (scan, no accept)
# Linux: full dual-role (accept_connections)
#
# Expected: Mac discovers Linux via scan, GATT PSM discovery returns error,
#           falls back to PSM 0x0085, opens L2CAP, handshake completes.
#
# Capture: sudo btmon -i hci0 -w /tmp/fips-testB-linux-ble.pklg
# Decrypt:  use /tmp/fips-ik-ephemeral-testB.jsonl

node:
  identity:
    persistent: true
  control:
    enabled: true
    socket_path: /run/fips/control.sock
  log_level: debug

tun:
  enabled: true
  mtu: 1280

dns:
  enabled: true
  bind_addr: "127.0.0.1"
  port: 5354

transports:
  ble:
    adapter: "hci0"
    mtu: 512
    accept_connections: true
    auto_connect: true
    scan: false
    advertise: true
    le_only: true
    send_rate_bps: 0
    debug_ephemeral_key_log_path: "/tmp/fips-ik-ephemeral-testB.jsonl"
    probe_cooldown_secs: 10
