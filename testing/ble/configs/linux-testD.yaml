# Test D: Performance run (iperf3 via TUN)
#
# Purpose: Measure sustained BLE throughput after establishing a link.
#          Use Test A or Test B configs to establish the link first,
#          then switch to this config for the performance run.
#
# Log level: info (less overhead than debug)
# Rate limit: 0 (unlimited — let BLE be the bottleneck)
#
# Usage:
#   iperf3 -s                   # on one node
#   iperf3 -c <peer_fd00> -6 -t 30 -P 1   # on the other

node:
  identity:
    persistent: true
  control:
    enabled: true
    socket_path: /run/fips/control.sock
  log_level: trace

tun:
  enabled: true
  mtu: 1280

dns:
  enabled: true
  bind_addr: "127.0.0.1"
  port: 5354

transports:
  ble:
    adapter: "hci0"
    mtu: 512
    accept_connections: true
    auto_connect: true
    scan: true
    advertise: true
    le_only: true
    send_rate_bps: 0
    probe_cooldown_secs: 10
