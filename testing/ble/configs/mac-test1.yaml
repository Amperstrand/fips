# Test 1: Normal operation
# Mac: macos_default() capabilities (PREFER_OUTBOUND)
# Linux: linux_default() capabilities (full, no preference)
# Expected: Mac outbound wins via preference tier (tier 2)
#
# Usage: sudo ./target/release/fips -c testing/ble/configs/mac-test1.yaml

node:
  identity:
    persistent: true
  control:
    enabled: true
    socket_path: /tmp/fips-control.sock
  log_level: debug

tun:
  enabled: true
  mtu: 1280

dns:
  enabled: true
  bind_addr: "127.0.0.1"
  port: 5354

transports:
  ble:
    adapter: "hci0"
    mtu: 512
    debug_ephemeral_key_log_path: "/tmp/fips-ik-ephemeral-test1.jsonl"
    probe_cooldown_secs: 10
