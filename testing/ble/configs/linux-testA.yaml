# Test A: Linux outbound → macOS inbound (Mac peripheral, Linux central)
#
# Purpose: Prove Linux can discover Mac's dynamic PSM via GATT and connect.
#          This tests the Linux→macOS direction that was previously blocked.
#
# Linux: central_only (scan, no accept)
# Mac:   full dual-role (accept_connections + advertise)
#
# Expected: Linux discovers Mac via scan, reads dynamic PSM from GATT,
#           opens L2CAP, handshake completes.
#
# Capture: sudo btmon -i hci0 -w /tmp/fips-testA-linux-ble.pklg
# Decrypt:  use /tmp/fips-ik-ephemeral-testA.jsonl

node:
  identity:
    persistent: true
  control:
    enabled: true
    socket_path: /run/fips/control.sock
  log_level: debug

tun:
  enabled: true
  mtu: 1280

dns:
  enabled: true
  bind_addr: "127.0.0.1"
  port: 5354

transports:
  ble:
    adapter: "hci0"
    mtu: 512
    accept_connections: false
    auto_connect: true
    scan: true
    advertise: true
    le_only: true
    send_rate_bps: 0
    debug_ephemeral_key_log_path: "/tmp/fips-ik-ephemeral-testA.jsonl"
    probe_cooldown_secs: 10
