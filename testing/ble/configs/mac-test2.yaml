# Test 2: Linux as central-only
# Mac: macos_default() capabilities (PREFER_OUTBOUND)
# Linux: central_only() (accept_connections=false → can't accept inbound)
# Expected: Mac outbound wins; Linux keeps any inbound from Mac
#
# Usage: sudo ./target/release/fips -c testing/ble/configs/mac-test2.yaml

node:
  identity:
    persistent: true
  control:
    enabled: true
    socket_path: /tmp/fips-control.sock
  log_level: debug

tun:
  enabled: true
  mtu: 1280

dns:
  enabled: true
  bind_addr: "127.0.0.1"
  port: 5354

transports:
  ble:
    adapter: "hci0"
    mtu: 512
    debug_ephemeral_key_log_path: "/tmp/fips-ik-ephemeral-test2.jsonl"
    probe_cooldown_secs: 10
