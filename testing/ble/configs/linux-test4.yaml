# Test 4: Speedtest
# Linux: full capabilities
# Expected: Functional throughput test with iperf3 via TUN
#
# Usage: sudo ./target/release/fips -c testing/ble/configs/linux-test4.yaml

node:
  identity:
    persistent: true
  control:
    enabled: true
    socket_path: /run/fips/control.sock
  log_level: info

tun:
  enabled: true
  mtu: 1280

dns:
  enabled: true
  bind_addr: "127.0.0.1"
  port: 5354

  transports:
    ble:
      adapter: "hci0"
      mtu: 512
      send_rate_bps: 100000
      send_burst_bytes: 2048
      probe_cooldown_secs: 10
